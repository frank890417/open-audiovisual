<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-audiovisual · 05 prebiotic flake</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script type="importmap">
{
  "imports": {
    "@openav/core": "../../packages/core/index.js",
    "@openav/midi": "../../packages/midi/index.js",
    "@openav/keys": "../../packages/keys/index.js",
    "@openav/sound": "../../packages/sound/index.js",
    "@openav/mapping": "../../packages/mapping/index.js",
    "@openav/timeline": "../../packages/timeline/index.js",
    "@openav/stage": "../../packages/stage/index.js",
    "@openav/console": "../../packages/console/index.js",
    "@openav/monitor": "../../packages/monitor/index.js"
  }
}
</script>
<style>
  body { margin: 0; background: #000; height: 100vh; display: grid;
    grid-template-columns: 1fr 340px; overflow: hidden; }
  #stage { position: relative; }
  #console { height: 100vh; display: flex; flex-direction: column; }
  #keys { padding: 8px 10px; background: #0d1017; border-bottom: 1px solid #1c2334; overflow-x: auto; }
  #desk { flex: 1; overflow-y: auto; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: #445; z-index: 2;
    font: 11px ui-monospace, monospace; pointer-events: none; }
  #sound-btn { position: absolute; right: 12px; top: 10px; z-index: 3;
    background: #1a2030; color: #cfd6e4; border: 1px solid #2a3348; border-radius: 8px;
    padding: 6px 14px; font: 12px ui-monospace, monospace; cursor: pointer; }
  #sound-btn.on { background: #2e6df6; color: #fff; border-color: #2e6df6; }
</style>
</head>
<body>
<div id="stage">
  <button id="sound-btn">🔊 enable sound (Tone.js)</button>
  <div id="hint">Prebiotic Flake (Che-Yu Wu, 2023) — a MIDI daily sketch, replayed through the framework<br>each note = one flake · the feedback zoom breathes · sound is optional, L4 audio branch</div>
</div>
<div id="console"><div id="keys"></div><div id="desk"></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>

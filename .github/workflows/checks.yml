name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # sitemap <lastmod> and the changelog read git history; a shallow clone made four tests red on every run
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test tests/*.test.js
  examples:
    # every p5 example page in a real headless Chromium: console clean, the sketch runs and draws, it survives being played,
    # and nothing it writes on its canvas hides under the 🎹 panel (p5/test/examples-smoke.cjs; the page 24 bug of 2026-10-19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --prefix "$RUNNER_TEMP/pw" playwright@1.62.1
      - run: npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - run: node p5/test/examples-smoke.cjs
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
  reference:
    # the API reference page, and every example and every claim in it, in a real headless Chromium under p5 1.x and 2.x
    # (p5/test/reference-smoke.cjs; the gates that need no browser are tests/reference.test.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --prefix "$RUNNER_TEMP/pw" playwright@1.62.1
      - run: npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - run: node p5/test/reference-smoke.cjs
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
      # the site search in the top bar: opens, finds micLevel (in Chinese too), and the bar is not crowded at 360 and 390 px
      - run: node p5/test/search-smoke.cjs
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
